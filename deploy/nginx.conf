# Dedicated host for the MCP. Install as the HTTP site first, then run
#   certbot --nginx -d dhan-mcp-test1.slash.markets
# which adds the TLS server block and the redirect in place.
server {
    listen 80;
    server_name dhan-mcp-test1.slash.markets;

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1m;
    }
}
